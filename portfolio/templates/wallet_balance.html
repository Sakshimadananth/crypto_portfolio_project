<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Wallet Balance</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* General Body Styling */
        body {
            font-family: 'monospace';
            background-color: #09394d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Card-style Form Container */
        .wallet-container {
            background-color: #142f3f;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(20, 87, 233, 0.5);
            padding: 30px;
            width: 400px;
            text-align: center;
        }

        /* Heading */
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        /* Input Field */
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            background-color: #1c4b5f;
            color: white;
        }

        /* Styled Button */
        .check-balance-btn {
            background-color: #496d73;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .check-balance-btn i {
            margin-right: 8px; /* Adds spacing between icon and text */
        }

        .check-balance-btn:hover {
            background-color: #4589a0;
        }

        /* Result Display */
        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #48eabf;
        }
    </style>
</head>
<body>
    <div class="wallet-container">
        <h1><i class="fas fa-wallet"></i> Check Your  Wallet Balance</h1>
        <form id="walletForm">
            <label for="walletAddress">Enter Ethereum Address:</label>
            <input type="text" id="walletAddress" name="walletAddress" placeholder="0xYourEthereumAddress" required>
            <button type="button" class="check-balance-btn" onclick="fetchBalance()">
                <i class="fas fa-search"></i> Check Balance
            </button>
        </form>
        <h3 id="result"></h3>
    </div>

    <script>
        async function fetchBalance() {
            const walletAddress = document.getElementById("walletAddress").value;

            if (!walletAddress.startsWith("0x") || walletAddress.length !== 42) {
                alert("Please enter a valid Ethereum address!");
                return;
            }

            const resultElement = document.getElementById("result");
            resultElement.innerHTML = "Fetching balance..."; // Loading state

            try {
                const response = await fetch(`/wallet/${walletAddress}/`);
                const data = await response.json();

                if (response.ok) {
                    resultElement.innerHTML = `Balance: ${data.eth_balance} ETH`;
                } else {
                    resultElement.innerHTML = `Error: ${data.error}`;
                }
            } catch (error) {
                resultElement.innerHTML = "An error occurred while fetching the balance.";
            }
        }
    </script>
</body>
</html>
