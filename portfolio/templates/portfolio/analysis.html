<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Portfolio Analysis</title>
    {% load static %}
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #000; /* Black Background */

        img {
            width: 80%;

        }
    </style>
</head>
<body>
    <h1>Crypto Portfolio Analysis</h1>
    <img src="{% static 'portfolio/images/analysis.png' %}" alt="Analysis Image">
